[package]
name = "mirage-gui"
version = "0.1.0"
description = "Mirage Dashboard"
authors = ["Mirage Contributors"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
mirage-core = { path = "../../crates/mirage-core" }
mirage-providers = { path = "../../crates/mirage-providers" }
mirage-protocol = { path = "../../crates/mirage-protocol" }
